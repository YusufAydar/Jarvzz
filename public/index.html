<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>J.A.R.V.Z.Z.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root { --c: #22d3ee; --c2: #0ea5e9; --dim: rgba(34,211,238,.35); --bg: #02060c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at center, #06202c 0%, var(--bg) 70%); color: var(--c); font-family: Rajdhani, sans-serif; overflow: hidden; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px);
    background-size: 40px 40px; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  canvas#orb { position: fixed; inset: 0; width: 100%; height: 100%; }
  .title { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); font-family: Orbitron; letter-spacing: .5em; font-size: 22px; text-shadow: 0 0 12px var(--c); white-space: nowrap; }
  .panel { position: fixed; border: 1px solid var(--dim); background: rgba(2,20,30,.45); padding: 12px 16px; backdrop-filter: blur(2px);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
  .panel h3 { margin: 0 0 8px; font: 700 11px Orbitron; letter-spacing: .25em; opacity: .8; }
  #clock { top: 70px; left: 24px; }
  #clock .t { font: 700 34px Orbitron; text-shadow: 0 0 10px var(--c); }
  #clock .d { font-size: 15px; opacity: .8; }
  #sys { top: 70px; right: 24px; width: 230px; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
  .bar span:first-child { width: 52px; }
  .bar i { flex: 1; height: 6px; background: rgba(34,211,238,.12); position: relative; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--c); box-shadow: 0 0 8px var(--c); transition: width .8s; }
  #log { left: 24px; bottom: 100px; width: min(420px, calc(100vw - 48px)); max-height: 38vh; overflow-y: auto; font-size: 16px; }
  #log p { margin: 6px 0; line-height: 1.3; }
  #log .u { color: #e0f2fe; opacity: .75; }
  #log .u::before { content: "› DU: "; color: var(--c); }
  #log .a::before { content: "› JARVZZ: "; font-weight: 600; }
  #state { position: fixed; left: 50%; top: calc(50% + min(26vh, 26vw) + 10px); transform: translateX(-50%); font: 400 13px Orbitron; letter-spacing: .4em; opacity: .85; white-space: nowrap; }
  #bottom { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 10px; width: min(640px, calc(100vw - 32px)); }
  #bottom input { flex: 1; background: rgba(2,20,30,.7); border: 1px solid var(--dim); color: var(--c); padding: 12px 14px; font: 16px Rajdhani; outline: none; }
  #bottom input:focus { border-color: var(--c); box-shadow: 0 0 10px var(--dim); }
  button { background: rgba(34,211,238,.1); border: 1px solid var(--c); color: var(--c); font: 700 12px Orbitron; letter-spacing: .15em; padding: 0 16px; cursor: pointer; }
  button:hover, button.on { background: var(--c); color: #001018; box-shadow: 0 0 16px var(--c); }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; cursor: pointer; font: 700 18px Orbitron; letter-spacing: .4em; text-align: center; }
  #boot small { display: block; margin-top: 14px; font: 14px Rajdhani; letter-spacing: .2em; opacity: .7; }
  @media (max-width: 760px) { #sys { display: none; } #clock .t { font-size: 24px; } #log { bottom: 90px; max-height: 24vh; } .title { font-size: 16px; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="title">J.A.R.V.Z.Z.</div>

<div class="panel" id="clock"><h3>ZEIT</h3><div class="t" id="time">00:00:00</div><div class="d" id="date"></div></div>
<div class="panel" id="sys"><h3>SYSTEM STATUS</h3>
  <div class="bar"><span>CPU</span><i><b id="cpu"></b></i></div>
  <div class="bar"><span>RAM</span><i><b id="ram"></b></i></div>
  <div class="bar"><span>NETZ</span><i><b id="net"></b></i></div>
  <div class="bar"><span>KERN</span><i><b id="core" style="width:100%"></b></i></div>
</div>
<div class="panel" id="log"><h3>PROTOKOLL</h3></div>
<div id="state">BEREIT</div>
<form id="bottom"><input id="inp" placeholder="Sag „Jarvis …“ oder tippe hier" autocomplete="off" /><button type="button" id="mic">MIC</button><button>SENDEN</button></form>
<div id="boot">SYSTEM STARTEN<small>Klicken zum Initialisieren</small></div>

<script>
const $ = (id) => document.getElementById(id);
const history = [];
let state = "idle";            // idle | listening | thinking | speaking
let level = 0;                 // Audio-Pegel 0..1 für die Orb-Animation
let analyser, micData;

function setState(s, label) { state = s; $("state").textContent = label || { idle: "BEREIT", listening: "ICH HÖRE ZU", thinking: "VERARBEITE", speaking: "SPRICHT" }[s]; }
function log(cls, text) { const p = document.createElement("p"); p.className = cls; p.textContent = text; $("log").appendChild(p); $("log").scrollTop = 1e9; }

// ---------- Uhr & Fake-Systemwerte ----------
setInterval(() => {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("de-DE");
  $("date").textContent = d.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
}, 250);
setInterval(() => { for (const id of ["cpu", "ram", "net"]) $(id).style.width = 20 + Math.random() * 70 + "%"; }, 1500);

// ---------- Sprachausgabe ----------
let voice;
speechSynthesis.onvoiceschanged = () => {
  const v = speechSynthesis.getVoices().filter((v) => v.lang.startsWith("de"));
  voice = v.find((x) => /male|Markus|Stefan|Conrad|Hans/i.test(x.name)) || v[0];
};
function speak(text) {
  return new Promise((done) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.voice = voice; u.rate = 1.02; u.pitch = 0.85;
    u.onstart = () => setState("speaking");
    u.onend = u.onerror = () => { setState("idle"); done(); };
    speechSynthesis.speak(u);
  });
}

// ---------- Gehirn (Claude über den Server) ----------
async function ask(text) {
  log("u", text);
  history.push({ role: "user", content: text });
  setState("thinking");
  let reply;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages: history }) });
    reply = (await r.json()).reply;
  } catch { reply = "Sir, ich erreiche meinen Server nicht."; }
  history.push({ role: "assistant", content: reply });
  log("a", reply);
  await speak(reply);
}

$("bottom").onsubmit = (e) => { e.preventDefault(); const t = $("inp").value.trim(); if (t) { $("inp").value = ""; ask(t); } };

// ---------- Spracherkennung mit Weckwort "Jarvis" ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, micOn = false;
if (SR) {
  rec = new SR(); rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e) => {
    const t = e.results[e.results.length - 1][0].transcript.trim();
    if (state === "speaking" || state === "thinking") return;
    const m = t.match(/^(?:hey\s+|hallo\s+|ok\s+)?(?:jarvis|jarvz+|javis|tschawis)[,.!\s]*(.*)$/i);
    if (m) m[1] ? ask(m[1]) : (log("a", "Ja, Sir?"), speak("Ja, Sir?"));
  };
  rec.onend = () => { if (micOn) try { rec.start(); } catch {} };
}
$("mic").onclick = () => {
  if (!rec) return log("a", "Spracherkennung wird nur in Chrome oder Edge unterstützt.");
  micOn = !micOn; $("mic").classList.toggle("on", micOn);
  if (micOn) { rec.start(); setState("listening", "WARTE AUF „JARVIS“"); } else { rec.stop(); setState("idle"); }
};

async function initMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(analyser);
    micData = new Uint8Array(analyser.frequencyBinCount);
  } catch { /* ohne Mikro geht's auch */ }
}

// ---------- Arc-Reactor-Orb ----------
const cv = $("orb"), g = cv.getContext("2d");
function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();

function arc(r, a0, a1, w, alpha) { g.beginPath(); g.arc(0, 0, r, a0, a1); g.lineWidth = w; g.strokeStyle = `rgba(34,211,238,${alpha})`; g.stroke(); }

function draw(t) {
  t /= 1000;
  const W = cv.width, H = cv.height, R = Math.min(W, H) * 0.24;
  g.clearRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H / 2);

  // Pegel: echtes Mikro beim Zuhören, simuliert beim Sprechen/Denken
  let target = 0.05 + 0.03 * Math.sin(t * 2);
  if (analyser && state === "listening") { analyser.getByteFrequencyData(micData); target = micData.reduce((a, b) => a + b, 0) / micData.length / 90; }
  if (state === "speaking") target = 0.35 + 0.35 * Math.abs(Math.sin(t * 9) * Math.sin(t * 5.3));
  if (state === "thinking") target = 0.2;
  level += (target - level) * 0.2;
  const speed = state === "thinking" ? 3 : 1;

  g.shadowColor = "#22d3ee"; g.shadowBlur = 18 * devicePixelRatio;

  // Außenringe mit Segmenten
  for (let i = 0; i < 3; i++) {
    g.save(); g.rotate(t * (0.3 + i * 0.25) * (i % 2 ? -1 : 1) * speed);
    const r = R * (1.15 - i * 0.12), segs = 6 + i * 4;
    for (let s = 0; s < segs; s++) { const a = (s / segs) * Math.PI * 2; arc(r, a, a + (Math.PI * 2 / segs) * 0.65, (3 - i) * devicePixelRatio, 0.35 + i * 0.15); }
    g.restore();
  }
  // Tick-Marken
  g.save(); g.rotate(-t * 0.1);
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2, l = i % 10 === 0 ? 14 : 6;
    g.beginPath(); g.moveTo(Math.cos(a) * R * 1.28, Math.sin(a) * R * 1.28); g.lineTo(Math.cos(a) * (R * 1.28 + l), Math.sin(a) * (R * 1.28 + l));
    g.lineWidth = devicePixelRatio; g.strokeStyle = "rgba(34,211,238,.4)"; g.stroke();
  }
  g.restore();

  // Audio-Balken rund um den Kern
  const bars = 96;
  for (let i = 0; i < bars; i++) {
    const a = (i / bars) * Math.PI * 2;
    const v = analyser && state === "listening" ? micData[i % micData.length] / 255 : level * (0.5 + 0.5 * Math.sin(i * 0.7 + t * 6));
    const r0 = R * 0.62, r1 = r0 + R * 0.05 + v * R * 0.3;
    g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    g.lineWidth = 2.5 * devicePixelRatio; g.strokeStyle = `rgba(34,211,238,${0.4 + v * 0.6})`; g.stroke();
  }

  // Kern
  const core = R * (0.42 + level * 0.12);
  const grad = g.createRadialGradient(0, 0, 0, 0, 0, core);
  grad.addColorStop(0, "rgba(224,250,255,.95)"); grad.addColorStop(0.35, "rgba(34,211,238,.75)"); grad.addColorStop(1, "rgba(14,165,233,0)");
  g.fillStyle = grad; g.beginPath(); g.arc(0, 0, core, 0, Math.PI * 2); g.fill();
  arc(R * 0.5, 0, Math.PI * 2, 2 * devicePixelRatio, 0.8);
  g.save(); g.rotate(t * 2 * speed); arc(R * 0.56, 0, Math.PI * 0.6, 3 * devicePixelRatio, 0.9); arc(R * 0.56, Math.PI, Math.PI * 1.6, 3 * devicePixelRatio, 0.9); g.restore();

  g.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ---------- Boot ----------
$("boot").onclick = async () => {
  $("boot").remove();
  await initMic();
  const h = new Date().getHours();
  const greet = (h < 11 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend") + ", Sir. Alle Systeme sind online. Wie kann ich helfen?";
  log("a", greet); speak(greet);
};
</script>
</body>
</html>
