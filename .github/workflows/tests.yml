# Prüft bei jeder Änderung am Code, ob alles noch funktioniert:
# 1. die automatischen Tests, 2. ein echter Probelauf mit 10 Tradern.
# Der Bericht des Probelaufs wird NICHT ins Repo gespeichert, sondern
# als Download ("Artifact") beim Lauf angehängt.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Automatische Tests
        run: python -m unittest discover tests -v

      - name: Jarvis-Tests (ohne Mikrofon und ohne API-Schlüssel)
        working-directory: jarvis
        run: |
          pip install "anthropic>=2.5.0"
          python -m unittest discover tests -v

      - name: Jarvis-Trading – echte Datenquellen prüfen (Yahoo, TradingView, Hyperliquid, Kalender)
        shell: bash   # mit "pipefail": ein Fehler im Live-Check lässt den Schritt wirklich scheitern
        run: python werkzeuge_entwicklung/live_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probelauf mit 10 echten Tradern
        run: python main.py --anzahl 10 --db probelauf/test.db --berichte probelauf

      - name: Probelauf-Bericht anzeigen
        run: cat probelauf/aktuell.md >> "$GITHUB_STEP_SUMMARY"

      - name: Muster der Top-Trader (Probelauf)
        run: |
          python muster.py --db probelauf/test.db --ausgabe probelauf/muster.md --max-coins 5
          cat probelauf/muster.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probelauf-Bericht zum Download anhängen
        uses: actions/upload-artifact@v4
        with:
          name: probelauf-bericht
          path: |
            probelauf/aktuell.md
            probelauf/muster.md
