# Großer Backtest des Trading-Roboters mit 2 Jahren Dukascopy-Kursen.
# Läuft bei Änderungen an der Strategie und per Knopfdruck (Reiter "Actions").
name: Roboter-Backtest

on:
  workflow_dispatch:
    inputs:
      tage:
        description: "Zeitraum in Tagen"
        default: "730"
  push:
    paths:
      - "jarvis/trader/**"
      - "jarvis/trading/setups.py"
      - "jarvis/trading/indikatoren.py"
      - "jarvis/trading/historie.py"
      - ".github/workflows/backtest.yml"
      - "werkzeuge_entwicklung/backtest_lauf.py"

# Nie zwei Läufe gleichzeitig (sonst bremst Dukascopy beide aus) – ein neuer Lauf ersetzt den alten
concurrency:
  group: roboter-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Heruntergeladene Kurse aufheben, damit der nächste Lauf schnell ist
      - name: Kurs-Historie aus dem Zwischenspeicher holen
        uses: actions/cache/restore@v4
        with:
          path: jarvis/daten/historie
          key: historie-${{ github.run_id }}
          restore-keys: historie-

      - name: Kurse laden (höchstens 150 Minuten, Rest beim nächsten Lauf)
        timeout-minutes: 150
        continue-on-error: true
        run: python werkzeuge_entwicklung/backtest_lauf.py laden "${{ github.event.inputs.tage || '730' }}"

      # Immer sichern – auch wenn der Download abgebrochen wurde
      - name: Kurs-Historie zwischenspeichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jarvis/daten/historie
          key: historie-${{ github.run_id }}

      - name: Strategien vergleichen
        timeout-minutes: 120
        run: python werkzeuge_entwicklung/backtest_lauf.py rechnen "${{ github.event.inputs.tage || '730' }}"

      - name: Ergebnis anzeigen
        if: always()
        run: cat backtest_ergebnis.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis zum Download anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-ergebnis
          path: backtest_ergebnis.md
